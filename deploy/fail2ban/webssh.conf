# fail2ban filter for WebSSH — only useful when clients reach WebSSH directly
# (LAN or Caddy). Behind Cloudflare Tunnel all traffic arrives from cloudflared,
# so rely on WebSSH's built-in lockouts + Cloudflare Access instead.
#
# /etc/fail2ban/filter.d/webssh.conf
[Definition]
failregex = "msg":"webssh auth failure ip=<HOST> user=
ignoreregex =

