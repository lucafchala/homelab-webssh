version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      xterm: { patterns: ["@xterm/*"] }
      codemirror: { patterns: ["@codemirror/*", "codemirror"] }
      fastify: { patterns: ["fastify", "@fastify/*"] }
      dev-tooling: { dependency-type: development }
    ignore:
      # @types/node must match the runtime (Node 22 in the Dockerfile, CI and .nvmrc); newer majors would
      # type-check APIs that don't exist at runtime. Bump it by hand together with the Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
